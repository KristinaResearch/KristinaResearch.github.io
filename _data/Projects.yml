contents:
  - title: Self-directed Projects
    description:
      - Independent MRI exploratory analysis. Performed all aspects of project and presented virtually at AAIC
      - Instigated the start of the HOPE (Health Outreach Program for the Elderly) project at VA Boston in collaboration with Boston Universtiy Alzheimer's Disease Center that helped provide Veterans of minority groups attain routine follow up care for their head injuries (providing healthcare, Neuropsych testing, MRI, tracking biological markers, and neuro exams) and added to research knowledge base.
      - Proposed research idea using Seddon Lab dataset "Genetic, Pharmacologic, and Inflammatory Determinants of Age-related Macular Degeneration Risk in Alzheimer’s Disease, Interactions Among Memory Medications, Immunosuppressants, and Calcium Regulation". Conducted comprehensive literature review and initiated steps to launch the project. 
      - Designed a thesis project extending existing work on perceptual and decision-making biases to examine perceptual stability, subjective experience, and individual differences. Independently conducted statistical analyses in R, including computation of objective and response-aligned perceptual error, linear mixed-effects modeling, within-participant measures of perceptual consistency across repeated trials, and mixed-effects analyses of reaction time. 
          - Research Interests inclue Perception and decision-making under affective context; perceptual bias and stability; cognitive processing dynamics; trauma- and stress-related alterations in perception.
      

